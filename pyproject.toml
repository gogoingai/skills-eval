[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-eval"
version = "0.3.2"
description = "Evaluate Claude skills plugins"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "pydantic",
    "PyYAML",
    "jsonschema",
    "pathspec",
    "cisco-ai-skill-scanner",
]

[project.optional-dependencies]
# Tencent aig-skill-scan is the only new scanner published on PyPI and is
# compatible with skills-eval's Python 3.10+ baseline. Install it with:
#   pip install "skills-eval[tencent-aig]"
tencent-aig = ["aig-skill-scan"]

[project.scripts]
skills-eval = "skills_eval.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skills_eval = ["schemas/*.json"]
