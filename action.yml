name: Skills Eval
description: Review a Claude Plugin repository with Skills Eval, upload its report, and summarize it on pull requests.

inputs:
  path:
    description: Plugin repository directory to check.
    required: false
    default: .
  skill:
    description: Optional Skill name or directory to check.
    required: false
    default: ""
  dry-run:
    description: Set to true to skip security scanning and report generation.
    required: false
    default: "false"
  external:
    description: Run native publishing-platform validations; never publishes.
    required: false
    default: "false"
  external-targets:
    description: Comma-separated enabled publishing targets to validate (for example, claude-plugin,workbuddy,clawhub).
    required: false
    default: ""
  version:
    description: PyPI requirement used to run Skills Eval.
    required: false
    default: skills-eval>=0.2.0,<0.3
  comment:
    description: Update one summary comment when the workflow runs for a pull request.
    required: false
    default: "true"

outputs:
  report-path:
    description: Absolute path to skills-eval-report.md, empty for dry runs.
    value: ${{ steps.check.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install pipx
      shell: bash
      run: python -m pip install --user pipx
    - name: Set up Node for native validators
      if: ${{ inputs.external-targets != '' }}
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install selected native validators
      if: ${{ inputs.external-targets != '' }}
      shell: bash
      env:
        INPUT_EXTERNAL_TARGETS: ${{ inputs.external-targets }}
      run: |
        set -euo pipefail
        IFS=',' read -r -a targets <<< "$INPUT_EXTERNAL_TARGETS"
        for target in "${targets[@]}"; do
          target="${target//[[:space:]]/}"
          case "$target" in
            claude-plugin) npm install --global @anthropic-ai/claude-code ;;
            workbuddy) npm install --global @tencent-ai/codebuddy-code ;;
            clawhub) npm install --global clawhub ;;
            "") ;;
            *) echo "Unsupported automatic native validator: $target" >&2; exit 2 ;;
          esac
        done
    - name: Run Skills Eval
      id: check
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SKILL: ${{ inputs.skill }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_EXTERNAL: ${{ inputs.external }}
        INPUT_EXTERNAL_TARGETS: ${{ inputs.external-targets }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set +e
        command=(python -m pipx run --spec "$INPUT_VERSION" skills-eval check "$INPUT_PATH")
        if [[ -n "$INPUT_SKILL" ]]; then
          command+=(--skill "$INPUT_SKILL")
        fi
        if [[ "$INPUT_DRY_RUN" == "true" ]]; then
          command+=(--dry-run)
          echo "report-path=" >> "$GITHUB_OUTPUT"
        else
          report_path="$(cd "$INPUT_PATH" && pwd)/skills-eval-report.md"
          echo "report-path=$report_path" >> "$GITHUB_OUTPUT"
        fi
        if [[ "$INPUT_EXTERNAL" == "true" || -n "$INPUT_EXTERNAL_TARGETS" ]]; then
          command+=(--external)
        fi
        if [[ -n "$INPUT_EXTERNAL_TARGETS" ]]; then
          IFS=',' read -r -a targets <<< "$INPUT_EXTERNAL_TARGETS"
          for target in "${targets[@]}"; do
            target="${target//[[:space:]]/}"
            [[ -n "$target" ]] && command+=(--external-target "$target")
          done
        fi
        "${command[@]}"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Upload Skills Eval report
      if: ${{ always() && inputs.dry-run != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: skills-eval-report
        path: ${{ steps.check.outputs.report-path }}
        if-no-files-found: warn
    - name: Update pull request comment
      if: ${{ always() && github.event_name == 'pull_request' && inputs.comment == 'true' && inputs.dry-run != 'true' }}
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        REPORT_PATH: ${{ steps.check.outputs.report-path }}
        ARTIFACT_NAME: skills-eval-report
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require("fs");
          const marker = "<!-- skills-eval-report -->";
          const reportPath = process.env.REPORT_PATH;
          const pullNumber = context.payload.pull_request?.number;

          if (!pullNumber || !fs.existsSync(reportPath)) {
            core.warning("Skills Eval report was not available for a pull request comment.");
            return;
          }

          const { owner, repo } = context.repo;
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
          const headSha = context.payload.pull_request.head.sha;
          const shortSha = headSha.slice(0, 7);
          const headUrl = `${context.serverUrl}/${owner}/${repo}/commit/${headSha}`;
          const checkedAt = Math.floor(Date.now() / 1000);
          const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
            owner,
            repo,
            run_id: context.runId,
          });
          const artifact = artifacts.data.artifacts.find(
            (candidate) => candidate.name === process.env.ARTIFACT_NAME && !candidate.expired,
          );
          const artifactUrl = artifact
            ? `${runUrl}/artifacts/${artifact.id}`
            : runUrl;
          const report = fs.readFileSync(reportPath, "utf8").trim();
          const chineseReport = report.includes("# Skills 审查报告");
          const labels = chineseReport
            ? {
                title: "Skills Eval 审查结果",
                commit: "最新提交",
                completed: "审查完成",
                updates: "此评论会随 PR 后续提交原地更新。",
                download: "下载完整报告",
                view: "查看本次运行",
              }
            : {
                title: "Skills Eval review",
                commit: "Latest commit",
                completed: "Completed",
                updates: "This comment updates in place after each new commit to this pull request.",
                download: "Download full report",
                view: "View workflow run",
              };
          const maxReportLength = 55000;
          const displayedReport = report.length > maxReportLength
            ? `${report.slice(0, maxReportLength)}\n\n_报告过长，完整内容请下载附件。_`
            : report;
          const body = [
            marker,
            "> 🤖 **Powered by [Skills Eval](https://github.com/gogoingai/skills-eval)** — an open-source pre-release reviewer for multi-Skill Claude Plugins.",
            "",
            `## ${labels.title}`,
            "",
            `> ${labels.commit}：[\`${shortSha}\`](${headUrl})`,
            `> ${labels.completed}：<t:${checkedAt}:F> · [${labels.view}](${runUrl})`,
            `> _${labels.updates}_`,
            "",
            displayedReport,
            "",
            "---",
            `[${labels.download}](${artifactUrl})`,
          ].join("\n");
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number: pullNumber,
            per_page: 100,
          });
          const existing = comments.find(
            (comment) => comment.user.type === "Bot" && comment.body?.includes(marker),
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullNumber,
              body,
            });
          }
    - name: Fail when Skills Eval fails
      if: ${{ steps.check.outputs.exit-code != '0' }}
      shell: bash
      run: exit "${{ steps.check.outputs.exit-code }}"
